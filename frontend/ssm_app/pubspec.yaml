name: ssm_app
description: Smart School Manager - Système ERP SaaS pour établissements scolaires
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.1.0

  # Stockage local
  shared_preferences: ^2.2.2

  # Utilitaires
  uuid: ^4.3.3
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  open_file: ^4.0.0
  share_plus: ^10.1.4
  image_picker: ^1.2.2
  file_picker: ^8.1.2

  # Design system
  google_fonts: ^6.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_square_white_bg.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon_square_white_bg.png"
    background_color: "#FFFFFF"
    theme_color: "#1E3A8A"
  windows:
    generate: true
    image_path: "assets/icon/icon_square_white_bg.png"
    icon_size: 256